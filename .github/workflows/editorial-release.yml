name: Release scheduled editorial content

on:
  schedule:
    - cron: "15 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mark due content for the connected Cloudflare build
        run: node scripts/editorial-release.mjs
      - name: Trigger the connected Cloudflare build with the release record
        run: |
          if test -n "$(git status --porcelain -- editorial/2026-nov-dez/releases)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add editorial/2026-nov-dez/releases
            git commit -m "chore: release due ShelfFlow editorial content"
            git push origin HEAD:main
          fi
